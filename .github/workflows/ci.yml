name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: "npm"

      - run: npm ci

      # --with-deps installs the Linux system libraries the browsers need on the
      # Ubuntu runner. Never run this locally — see README.
      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - run: npm run build
        env:
          SITE_URL: "https://bridvance.example"

      - run: npm run assert:bundle

      - run: npm run e2e
        env:
          SITE_URL: "https://bridvance.example"

      - name: Lighthouse budget
        env:
          SITE_URL: "https://bridvance.example"
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          npm run lhci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # The production dependency tree is clean and gated above. The remaining
  # advisories are all dev-only, inside @lhci/cli's puppeteer tail, and have no
  # upstream fix — 0.15.1 is the latest published version, and npm's suggested
  # "fix" is a downgrade to 0.1.0. They never reach the shipped bundle. Kept
  # moving by .github/dependabot.yml (weekly npm updates).
