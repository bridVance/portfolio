version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Deliberate version floors — see spec §4.1 / §10.1.
      # Tailwind v4 is a breaking rewrite; the project is committed to v3.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # Must track next's major; Next 16's Turbopack-default build breaks
      # the @next/bundle-analyzer gate the "no three in bundle" CI depends on.
      - dependency-name: "@next/bundle-analyzer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
